{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="login-page">
    <div class="login-card">
        <div id="loginPanel">
            <h2>智能执法记录仪</h2>
            <p class="login-sub">请登录系统</p>
            <div class="form-group"><label>用户名</label><input type="text" id="loginUser" placeholder="输入用户名"></div>
            <div class="form-group"><label>密码</label><input type="password" id="loginPass" placeholder="输入密码"></div>
            <button class="btn btn-primary btn-full" onclick="doLogin()">登录</button>
            <p class="switch-link">还没有账户？<a href="#" onclick="showRegister()">注册</a></p>
        </div>
        <div id="registerPanel" class="hidden">
            <h2>注册新用户</h2>
            <div class="form-group"><label>用户名</label><input type="text" id="regUser"></div>
            <div class="form-group"><label>真实姓名</label><input type="text" id="regName"></div>
            <div class="form-group"><label>密码</label><input type="password" id="regPass"></div>
            <div class="form-group"><label>确认密码</label><input type="password" id="regConfirm"></div>
            <button class="btn btn-primary btn-full" onclick="doRegister()">注册</button>
            <p class="switch-link">已有账户？<a href="#" onclick="showLogin()">返回登录</a></p>
        </div>
        <div id="loginMsg" class="msg hidden"></div>
    </div>
</div>
{% endblock %}
